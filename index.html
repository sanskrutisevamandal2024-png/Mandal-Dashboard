<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanskruti Seva Mandal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1E2B24;
    --muted: #5C6B62;
    --green: #1F6B4A;
    --marigold: #F2A900;
    --saffron: #E4572E;
    --hibiscus: #C2263A;
    --bg: #F2F5F0;
    --card: #FFFFFF;
    --line: #D6DED3;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Mukta", "Noto Sans Devanagari", system-ui, sans-serif;
    font-size: 17px; line-height: 1.5;
  }
  .garland {
    height: 14px;
    background:
      radial-gradient(circle at 10px 7px, var(--marigold) 0 6px, transparent 6.5px) 0 0 / 40px 14px repeat-x,
      radial-gradient(circle at 30px 7px, var(--saffron) 0 6px, transparent 6.5px) 0 0 / 40px 14px repeat-x;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 0 8px; }
  h1 { font-family: "Yatra One", "Mukta", serif; font-weight: 400; font-size: clamp(30px, 7vw, 46px); line-height: 1.15; margin: 0; color: var(--green); }
  header p { margin: 4px 0 0; color: var(--muted); }
  .lang { border: 1px solid var(--green); background: transparent; color: var(--green); border-radius: 999px; padding: 4px 14px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .lang:hover { background: var(--green); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }

  .tabs { display: flex; gap: 8px; margin: 14px 0 18px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }

  section { margin: 0 0 26px; }
  h2 { font-size: 20px; margin: 0 0 10px; font-weight: 700; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .stat { padding: 14px 16px; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .v { display: block; font-size: clamp(20px, 5vw, 32px); font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .stat:first-child .v { font-family: "Yatra One", "Mukta", serif; font-weight: 400; font-size: clamp(30px, 8vw, 46px); color: var(--hibiscus); }
  .stat .l { color: var(--muted); font-size: 15px; }

  .bars { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; }
  .bar { padding: 8px 0; }
  .bar + .bar { border-top: 1px solid var(--line); }
  .bar .row { display: flex; justify-content: space-between; gap: 12px; }
  .bar .row b { font-weight: 600; }
  .bar .row span { color: var(--muted); text-align: right; }
  .track { height: 8px; background: #E7ECE4; border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .fill { height: 100%; background: var(--green); border-radius: 4px; transition: width .4s ease; }
  .bar.cur .fill { background: var(--marigold); }

  .fin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pos { color: var(--green); } .neg { color: var(--hibiscus); }
  .lines { list-style: none; margin: 0; padding: 0; }
  .lines li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  .lines li:first-child { border-top: 0; }
  .lines .tot { font-weight: 700; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; }
  .box h3 { margin: 0 0 4px; font-size: 17px; }

  .search { width: 100%; font: inherit; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); margin-bottom: 10px; }
  .members { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .members li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 16px; }
  .members li + li { border-top: 1px solid var(--line); }
  .members .sub { color: var(--muted); font-size: 14px; display: block; }
  .members .amt { font-weight: 600; white-space: nowrap; }
  .empty { padding: 18px 16px; color: var(--muted); }
  .count { color: var(--muted); font-weight: 400; }

  #state { padding: 40px 0; text-align: center; color: var(--muted); }
  #state.error { color: var(--hibiscus); }
  footer { color: var(--muted); font-size: 14px; padding: 0 0 36px; }

  .members .end { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .chip { font-size: 13px; line-height: 1.5; border-radius: 999px; padding: 0 10px; border: 1px solid; white-space: nowrap; }
  .chip.ok { color: var(--green); border-color: var(--green); }
  .chip.due { color: var(--hibiscus); border-color: var(--hibiscus); }
  .chip.adv { color: #8A5A00; border-color: var(--marigold); }

  /* Professional palette: one brand maroon (from the logos), muted gold accent, cool neutrals */
  :root {
    --ink: #1F2933; --muted: #5F6B76; --bg: #F4F5F7; --card: #FFFFFF; --line: #E1E5EA;
    --green: #2F7D5B; --hibiscus: #B3261E; --marigold: #C8962E; --saffron: #4A1512;
  }
  body { background: var(--bg); }
  .band { background: #4A1512; }
  .garland { height: 4px; background: var(--marigold); }
  .bandin { display: flex; align-items: center; gap: 14px; padding-top: 14px; padding-bottom: 14px; }
  .bandtxt { flex: 1; text-align: center; min-width: 0; }
  .band h1 { color: #FFFFFF; font-size: clamp(24px, 6vw, 40px); }
  .band p { color: #E6D3D0; margin: 2px 0 8px; }
  .logo { height: clamp(64px, 17vw, 100px); width: auto; background: #fff; border-radius: 12px; padding: 5px; box-shadow: 0 1px 6px rgba(0,0,0,.3); }
  .band .lang { border-color: rgba(255,255,255,.7); color: #fff; }
  .band .lang:hover { background: #fff; color: #4A1512; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
  .tab { white-space: nowrap; color: var(--ink); }
  .tab:hover { background: #EFE9E8; }
  .tab[aria-pressed="true"] { background: #4A1512; border-color: #4A1512; color: #fff; }
  .fill { background: #4A1512; }
  .bar.cur .fill { background: var(--marigold); }
  .track { background: #E9ECF0; }
  .stats, .fin, .box, .bars, .members { border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(31,41,51,.06); }
  .stat:first-child .v { color: #4A1512; }
  h2 { color: #4A1512; font-size: 19px; border-left: 4px solid var(--marigold); padding-left: 10px; }
  .chip.adv { color: #7A5A12; border-color: var(--marigold); }

  .login { max-width: 420px; margin: 28px auto; padding: 8px 20px 20px; }
  .login label, .set label { display: block; margin: 10px 0 4px; font-weight: 600; }
  .set { padding: 6px 16px 16px; margin-bottom: 8px; }
  .btn { font: inherit; font-weight: 600; background: #4A1512; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; cursor: pointer; width: 100%; margin-top: 8px; }
  .btn:hover { background: #5E1D19; }
  .btn:disabled { opacity: .6; cursor: default; }
  .msg { margin: 10px 0 0; min-height: 1.4em; }
  .msg.err { color: var(--hibiscus); } .msg.ok { color: var(--green); }
  .band .lang + .lang { margin-left: 8px; }

  @media (max-width: 560px) {
    .stats, .fin { grid-template-columns: 1fr; }
    .stat + .stat { border-left: 0; border-top: 1px solid var(--line); }
    .cols { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
  html, body { max-width: 100%; overflow-x: hidden; }
  input, button, select { font-size: 16px; }
  img { max-width: 100%; height: auto; }
</style>
</head>

/*DATA-START*/
/* ===== Dashboard settings: change years, tab names and options HERE (no Code.gs change needed) ===== */
const APP_CONFIG = {
  YEARS: [   // newest first; 'tab' must match the sheet tab name exactly
    { label: '2026-27', tab: 'Sabhasad Detail 26-27' },
    { label: '2025-26', tab: 'Sabhasad Detail 25-26' },
    { label: '2024-25', tab: 'Sabhasad Detail 24-25' }
  ],
  TB_TAB: 'Trail Balance',
  BANK_TAB: 'Bank Statement',
  CASH_TAB: 'Cash Statement',
  CREDITOR_TAG: 'SUNDRY CREDITORS',
  IE_TAB: 'Income&Expanditure Accounts',
  SHOW_MEMBER_AMOUNTS: true
};

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad2 = n => (n < 10 ? '0' : '') + n;
const isD = v => v && typeof v === 'object' && v.__d !== undefined;
const r2 = n => Math.round(n * 100) / 100;
const num = v => {
  if (typeof v === 'number') return v;
  const s = String(v).replace(/[\u0966-\u096F]/g, d => String(d.charCodeAt(0) - 0x0966)).replace(/[^0-9.\-]/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const ist = ms => new Date(ms + 19800000);           // India time (UTC+5:30)
const fmtDate = v => {
  if (!isD(v)) return String(v).trim();
  const d = ist(v.__d);
  return pad2(d.getUTCDate()) + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
};
const nowText = () => {
  const d = ist(Date.now()), h = d.getUTCHours();
  return fmtDate({ __d: Date.now() }) + ', ' + pad2(h % 12 || 12) + ':' + pad2(d.getUTCMinutes()) + ' ' + (h < 12 ? 'AM' : 'PM');
};
const findCol = (header, names) => { for (let i = 0; i < names.length; i++) { const x = header.indexOf(names[i]); if (x >= 0) return x; } return -1; };
const need = (res, what) => { if (!res || res.error) throw new Error((res && res.error) || ('Missing ' + what)); return res.values; };

function parseYear(values, y) {
  if (!values.length) throw new Error('Empty tab: ' + y.tab);
  const header = values[0].map(h => String(h).trim().toLowerCase());
  const nameCol = findCol(header, ['full name', 'name']);
  const amountCol = findCol(header, ['amount']);
  const typeCol = findCol(header, ['sabhasad type']);
  if (nameCol < 0 || amountCol < 0) throw new Error('Name/Amount column missing in ' + y.tab);
  const members = [], byType = {};
  let total = 0;
  for (let i = 1; i < values.length; i++) {
    const row = values[i], name = String(row[nameCol]).trim();
    if (!name) continue;
    const amount = num(row[amountCol]), type = typeCol >= 0 ? String(row[typeCol]).trim() : '';
    total += amount;
    if (type) {
      byType[type] = byType[type] || { type: type, count: 0, total: 0 };
      byType[type].count++; byType[type].total += amount;
    }
    members.push({ n: name, t: type, a: APP_CONFIG.SHOW_MEMBER_AMOUNTS ? amount : null });
  }
  members.reverse();   // newest registration first
  return { label: y.label, count: members.length, total: total, average: members.length ? total / members.length : 0,
           byType: Object.keys(byType).map(k => byType[k]), members: members };
}

function parseTB(rows) {
  const cashLines = [], list = [];
  rows.forEach(r => {
    const group = String(r[1]).trim().toUpperCase(), name = String(r[2]).trim();
    if (!name) return;
    const opening = num(r[3]), debit = num(r[4]), credit = num(r[5]), closing = num(r[6]);
    if (group === 'ASSETS') {
      if (closing !== 0) cashLines.push({ name: name, amount: r2(closing) });
    } else if (group === APP_CONFIG.CREDITOR_TAG) {
      if (opening === 0 && debit === 0 && credit === 0) return;
      const due = r2(-closing);
      list.push({ name: name, opening: r2(-opening), billed: r2(credit), paid: r2(debit), due: due,
                  status: due > 0 ? 'due' : (due < 0 ? 'advance' : 'settled') });
    }
  });
  list.sort((a, b) => b.due - a.due);
  const sum = (arr, f) => r2(arr.reduce((s, x) => s + f(x), 0));
  const cashBank = sum(cashLines, x => x.amount);
  const cashOnHand = sum(cashLines.filter(x => /cash/i.test(x.name)), x => x.amount);
  return { cashBank: cashBank, cashOnHand: cashOnHand, bankBalance: r2(cashBank - cashOnHand), cashLines: cashLines,
    creditors: { list: list, totalDue: sum(list, x => x.due > 0 ? x.due : 0), vendorsWithDues: list.filter(x => x.due > 0).length,
                 totalBilled: sum(list, x => x.billed), totalPaid: sum(list, x => x.paid), payments: [] } };
}

function parsePayments(rows) {
  const out = [];
  rows.forEach(r => {
    if (String(r[10]).trim().toUpperCase() !== APP_CONFIG.CREDITOR_TAG) return;
    const amount = num(r[3]);
    if (amount <= 0) return;
    out.push({ ts: isD(r[0]) ? r[0].__d : 0, d: fmtDate(r[0]), v: String(r[8]).trim(), r: String(r[7]).trim(), a: amount });
  });
  out.sort((a, b) => b.ts - a.ts);
  return out.slice(0, 200).map(x => ({ d: x.d, v: x.v, r: x.r, a: x.a }));
}

function parseBank(rows) {
  let started = false, opening = 0, totalIn = 0, totalOut = 0;
  const list = [];
  rows.forEach(r => {
    if (!started) { started = String(r[0]).trim().toLowerCase() === 'date'; return; }
    if (!isD(r[0])) return;
    if (/^\s*(opeing|opening)\b/i.test(String(r[7]))) { opening = num(r[4]); return; }
    const i = num(r[2]), o = num(r[3]);
    totalIn += i; totalOut += o;
    list.push({ d: fmtDate(r[0]), h: String(r[8]).trim(), r: String(r[7]).trim(), c: String(r[5]).trim(), i: i, o: o, b: num(r[4]) });
  });
  return { opening: opening, totalIn: r2(totalIn), totalOut: r2(totalOut), count: list.length, rows: list.reverse().slice(0, 300) };
}

function parseCash(rows) {
  let started = false, totalIn = 0, totalOut = 0;
  const list = [];
  rows.forEach(r => {
    if (!started) { started = String(r[0]).trim().toLowerCase() === 'date'; return; }
    const i = num(r[1]), o = num(r[2]);
    if (!i && !o) return;
    totalIn += i; totalOut += o;
    const tags = [r[5], r[6]].map(t => String(t).trim()).filter(t => t && !/cash/i.test(t));
    list.push({ d: fmtDate(r[0]), h: tags[0] || '', r: String(r[4]).trim(), c: '', i: i, o: o, b: num(r[3]) });
  });
  return { opening: 0, totalIn: r2(totalIn), totalOut: r2(totalOut), count: list.length, rows: list.reverse().slice(0, 300) };
}

function parseIE(rows) {   // C5:I24 -> expenses in C+D, income in G+H
  const expenses = [], income = [];
  rows.forEach(r => {
    const en = String(r[0]).trim();
    if (en && typeof r[1] === 'number' && r[1] > 0) expenses.push({ name: en, amount: r[1] });
    const inn = String(r[4]).trim();
    if (inn && typeof r[5] === 'number' && r[5] > 0) income.push({ name: inn, amount: r[5] });
  });
  const byAmount = (a, b) => b.amount - a.amount;
  expenses.sort(byAmount); income.sort(byAmount);
  const totalIncome = income.reduce((s, x) => s + x.amount, 0), totalExpense = expenses.reduce((s, x) => s + x.amount, 0);
  return { income: income, expenses: expenses, totalIncome: totalIncome, totalExpense: totalExpense, net: totalIncome - totalExpense };
}

/* results: server answers in the same order as the requests made in fetchDashboard() */
function buildDashboard(results) {
  const C = APP_CONFIG, n = C.YEARS.length;
  const years = C.YEARS.map((y, i) => {
    const r = parseYear(need(results[i], y.tab), y);
    if (i > 0) { r.members = []; r.byType = []; }   // older years: counts and totals only
    return r;
  });
  const tbRows = need(results[n], C.TB_TAB), bankRows = need(results[n + 1], C.BANK_TAB),
        cashRows = need(results[n + 2], C.CASH_TAB), ieRows = need(results[n + 3], C.IE_TAB);
  const tb = parseTB(tbRows);
  tb.creditors.payments = parsePayments(bankRows);
  const bank = parseBank(bankRows); bank.balance = tb.bankBalance;
  const cash = parseCash(cashRows); cash.balance = tb.cashOnHand;
  const ie = parseIE(ieRows);
  return { years: years, updated: nowText(), accounts: {
    cashBank: tb.cashBank, cashLines: tb.cashLines, creditors: tb.creditors, bank: bank, cash: cash,
    income: ie.income, expenses: ie.expenses, totalIncome: ie.totalIncome, totalExpense: ie.totalExpense, net: ie.net } };
}

function fetchDashboard(done, fail) {
  const C = APP_CONFIG;
  const reqs = C.YEARS.map(y => ({ k: 'members', tab: y.tab, cols: 12 })).concat([
    { k: 'accounts', tab: C.TB_TAB, cols: 8 },
    { k: 'accounts', tab: C.BANK_TAB, cols: 11 },
    { k: 'accounts', tab: C.CASH_TAB, cols: 7 },
    { k: 'accounts', tab: C.IE_TAB, range: 'C5:I24' }
  ]);
  google.script.run.withSuccessHandler(function (r) {
    if (!r || r.authError) return done({ authError: true });
    try { done(buildDashboard(r.results)); } catch (e) { fail(e); }
  }).withFailureHandler(fail).readSheets(TOKEN, reqs);
}

let tab = 'members';
const sm = n => (n < 0 ? '−' : '') + money(Math.abs(n));

function bar(label, right, pct, cur) {
  return '<div class="bar' + (cur ? ' cur' : '') + '"><div class="row"><b>' + esc(label) + '</b><span>' + right + '</span></div>' +
    '<div class="track"><div class="fill" style="width:' + Math.max(pct, 1) + '%"></div></div></div>';
}
function lines(items) {
  if (!items.length) return '<li><span>—</span></li>';
  return items.map(i => '<li><span>' + esc(i.name) + '</span><span>' + sm(i.amount) + '</span></li>').join('');
}
function stat(v, l, cls) {
  return '<div class="stat"><span class="v' + (cls ? ' ' + cls : '') + '">' + v + '</span><span class="l">' + l + '</span></div>';
}
function chip(v, S) {
  return v.status === 'due' ? '<span class="chip due">' + S.dueChip + '</span>'
    : v.status === 'advance' ? '<span class="chip adv">' + S.advance + '</span>'
    : '<span class="chip ok">' + S.settled + '</span>';
}

function render() {
  const S = I18N[lang], y = DATA.years[yearIdx], A = DATA.accounts, C = A.creditors;
  document.documentElement.lang = lang;
  applyStatic();
  $('q').placeholder = S.search; $('q').setAttribute('aria-label', S.search);

  $('tabs').innerHTML = [['members', S.tabMembers], ['accounts', S.tabAccounts], ['bank', S.tabBank], ['cash', S.tabCash]].concat(ROLE === 'admin' ? [['settings', S.tabSettings]] : []).map(t =>
    '<button class="tab" type="button" data-tab="' + t[0] + '" aria-pressed="' + (tab === t[0]) + '">' + esc(t[1]) + '</button>').join('');
  $('pMembers').hidden = tab !== 'members';
  $('pAccounts').hidden = tab !== 'accounts';
  $('pBank').hidden = tab !== 'bank';
  $('pCash').hidden = tab !== 'cash';
  $('pSettings').hidden = tab !== 'settings';
  if (tab === 'settings') renderSettings();

  // ---- Members tab ----
  $('summary').innerHTML =
    stat(y.count, S.members) + stat(money(y.total), S.collected) + stat(money(y.average), S.avg);

  $('typesSec').hidden = !y.byType.length;
  $('typesH').textContent = S.byType;
  $('types').innerHTML = y.byType.map(t =>
    bar(typeName(t.type), t.count + ' · ' + money(t.total), t.count / y.count * 100, false)).join('');

  const maxCount = Math.max.apply(null, DATA.years.map(v => v.count).concat(1));
  $('cmpH').textContent = S.compare;
  $('compare').innerHTML = DATA.years.map((v, i) =>
    bar(v.label, v.count + ' · ' + money(v.total), v.count / maxCount * 100, i === yearIdx)).join('');

  $('listH').textContent = S.list;

  // ---- Accounts tab ----
  const netCls = A.net >= 0 ? 'pos' : 'neg';
  $('balTop').innerHTML =
    stat(money(A.cashBank), S.balance) +
    stat(money(C.totalDue), S.pending + (C.vendorsWithDues ? ' (' + C.vendorsWithDues + ' ' + S.vendors + ')' : '')) +
    stat(sm(A.net), A.net >= 0 ? S.netPos : S.netNeg, netCls);

  $('balH').textContent = S.balance;
  $('balL').innerHTML = lines(A.cashLines) +
    '<li class="tot"><span>' + S.total + '</span><span>' + money(A.cashBank) + '</span></li>';

  $('credH').textContent = S.creditors;
  $('credTop').innerHTML = stat(money(C.totalDue), S.dueNow) + stat(money(C.totalBilled), S.billed) + stat(money(C.totalPaid), S.paid);
  $('credL').innerHTML = C.list.length ? C.list.map(v =>
    '<li><span>' + esc(v.name) + '<span class="sub">' + S.opening + ' ' + sm(v.opening) + ' · ' + S.billed + ' ' + money(v.billed) +
    ' · ' + S.paid + ' ' + money(v.paid) + '</span></span>' +
    '<span class="end"><span class="amt' + (v.due > 0 ? ' neg' : '') + '">' + money(Math.abs(v.due)) + '</span>' + chip(v, S) + '</span></li>').join('')
    : '<li class="empty">' + S.noCred + '</li>';

  $('payH').textContent = S.payments + ' (' + C.payments.length + ')';
  $('payL').innerHTML = C.payments.length ? C.payments.map(p =>
    '<li><span>' + esc(p.v) + '<span class="sub">' + esc(p.d) + (p.r ? ' · ' + esc(p.r) : '') + '</span></span>' +
    '<span class="amt">' + money(p.a) + '</span></li>').join('')
    : '<li class="empty">' + S.noPay + '</li>';

  $('finH').textContent = S.finance;
  $('incH').textContent = S.income; $('expH').textContent = S.expense;
  $('incL').innerHTML = lines(A.income) + '<li class="tot"><span>' + S.total + '</span><span>' + money(A.totalIncome) + '</span></li>';
  $('expL').innerHTML = lines(A.expenses) + '<li class="tot"><span>' + S.total + '</span><span>' + money(A.totalExpense) + '</span></li>';

  stmt('bank', S.bankBal, A.bank, S);
  stmt('cash', S.cashBal, A.cash, S);

  $('foot').textContent = S.updated + ': ' + DATA.updated;
  renderList();
}

function renderSettings() {
  const S = I18N[lang], el = $('pSettings');
  if (!SETTINGS) {
    el.innerHTML = '<p class="empty">' + S.load + '</p>';
    google.script.run.withSuccessHandler(function (r) {
      if (!r || r.authError) return showLogin();
      SETTINGS = r; if (tab === 'settings') renderSettings();
    }).getSettings(TOKEN);
    return;
  }
  const f = (id, label, type, val, ac) => '<label for="' + id + '">' + label + '</label><input class="search" id="' + id +
    '" type="' + type + '" value="' + esc(val) + '" autocomplete="' + ac + '" autocapitalize="none" required>';
  el.innerHTML =
    '<section><h2>' + S.membersList + ' (' + SETTINGS.members.length + ')</h2><ul class="members">' + (SETTINGS.members.length ? SETTINGS.members.map(m => '<li><span>' + esc(m) + '</span><button class="btn" type="button" data-del="' + esc(m) + '">' + S.del + '</button></li>').join('') : '<li class="empty">' + S.noMembers + '</li>') + '</ul>' +
      '<form class="box set" id="fMember">' + f('mUid', S.newUser, 'text', '', 'off') + f('mPw', S.newPass, 'text', '', 'off') +
      '<button class="btn" type="submit">' + S.addMember + '</button><p class="msg" id="mMsg" role="status"></p></form></section>' +
    '<section><h2>' + S.adminLogin + '</h2><form class="box set" id="fAdmin">' +
      f('aCur', S.curAdminPass, 'password', '', 'current-password') + f('aUid', S.newUser, 'text', SETTINGS.adminUser, 'off') +
      f('aPw', S.newPass, 'password', '', 'new-password') +
      '<button class="btn" type="submit">' + S.update + '</button><p class="msg" id="aMsg" role="status"></p></form></section>';
}

$('pSettings').addEventListener('submit', function (e) {
  e.preventDefault();
  const S = I18N[lang], isM = e.target.id === 'fMember', msg = $(isM ? 'mMsg' : 'aMsg');
  const fail = () => { msg.className = 'msg err'; msg.textContent = S.err; };
  msg.className = 'msg'; msg.textContent = '';
  const done = function (r) {
    if (!r || r.authError) return showLogin();
    if (!r.ok) { msg.className = 'msg err'; msg.textContent = S[r.error] || S.err; return; }
    if (r.relogin) return showLogin(S.reLogin, true);
    if (r.members) SETTINGS.members = r.members; renderSettings();
    $('mMsg').className = 'msg ok'; $('mMsg').textContent = S.saved;
  };
  const run = google.script.run.withSuccessHandler(done).withFailureHandler(fail);
  if (isM) run.addMember(TOKEN, $('mUid').value.trim(), $('mPw').value);
  else run.updateAdminLogin(TOKEN, $('aCur').value, $('aUid').value, $('aPw').value);
});

function stmt(id, balLabel, d, S) {
  $(id + 'Top').innerHTML = stat(money(d.balance), balLabel) + stat(money(d.totalIn), S.received, 'pos') + stat(money(d.totalOut), S.paidOut, 'neg');
  $(id + 'H').textContent = (id === 'bank' ? S.bankH : S.cashH) + ' (' + d.count + ')';
  $(id + 'L').innerHTML = d.rows.length ? d.rows.map(t =>
    '<li><span>' + esc(t.h || t.r || '—') + '<span class="sub">' + esc(t.d) + (t.h && t.r ? ' · ' + esc(t.r) : '') + (t.c ? ' · ' + esc(t.c) : '') + '</span></span>' +
    '<span class="end">' + (t.i > 0 ? '<span class="amt pos">+' + money(t.i) + '</span>' : '<span class="amt neg">−' + money(t.o) + '</span>') +
    '<span class="sub">' + S.bal + ' ' + money(t.b) + '</span></span></li>').join('')
    : '<li class="empty">' + S.noStmt + '</li>';
}

function renderList() {
  if (!DATA) return;
  const S = I18N[lang], y = DATA.years[yearIdx];
  const q = $('q').value.trim().toLowerCase();
  const rows = y.members.filter(m => !q || m.n.toLowerCase().indexOf(q) >= 0);
  $('listC').textContent = '(' + rows.length + ')';
  if (!rows.length) {
    $('members').innerHTML = '<li class="empty">' + (y.count ? S.none : S.noneYear) + '</li>';
    return;
  }
  $('members').innerHTML = rows.map(m =>
    '<li><span>' + esc(m.n) + (m.t ? '<span class="sub">' + esc(typeName(m.t)) + '</span>' : '') + '</span>' +
    (m.a === null ? '' : '<span class="amt">' + money(m.a) + '</span>') + '</li>').join('');
}

$('pSettings').addEventListener('click', function (e) {
  const b = e.target.closest('button[data-del]');
  if (!b) return;
  const S = I18N[lang];
  if (!confirm(S.confirmDel + ' ' + b.dataset.del)) return;
  google.script.run.withSuccessHandler(function (r) {
    if (!r || r.authError) return showLogin();
    if (r.ok) { SETTINGS.members = r.members; renderSettings(); }
  }).deleteMember(TOKEN, b.dataset.del);
});

/* Auto logout after 5 minutes without activity; heartbeat keeps the server session alive while active. */
const IDLE_MS = 5 * 60 * 1000;
let lastActive = Date.now(), lastPing = 0;
['click', 'touchstart', 'keydown', 'scroll', 'mousemove'].forEach(function (ev) {
  window.addEventListener(ev, function () { lastActive = Date.now(); }, { passive: true });
});
function idleCheck() {
  if (!TOKEN) return;
  const now = Date.now();
  if (now - lastActive >= IDLE_MS) {
    google.script.run.logout(TOKEN);
    return showLogin(I18N[lang].idleOut, false);
  }
  if (lastActive > lastPing && now - lastPing >= 60000) {
    lastPing = now;
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok) showLogin(I18N[lang].idleOut, false);
    }).ping(TOKEN);
  }
}
setInterval(idleCheck, 15000);
document.addEventListener('visibilitychange', idleCheck);
</script>
